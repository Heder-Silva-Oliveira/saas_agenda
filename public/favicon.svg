<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- fundo arredondado verde-floresta -->
  <rect width="32" height="32" rx="8" fill="#134E4A"/>
  <!-- ícone CalendarCheck branco -->
  <!-- corpo do calendário -->
  <rect x="6" y="10" width="20" height="17" rx="2" stroke="white" stroke-width="1.8" fill="none"/>
  <!-- linha superior do calendário -->
  <line x1="6" y1="15" x2="26" y2="15" stroke="white" stroke-width="1.8"/>
  <!-- pinos -->
  <line x1="11" y1="7" x2="11" y2="12" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="21" y1="7" x2="21" y2="12" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- check -->
  <polyline points="11,21 14,24 21,18" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
